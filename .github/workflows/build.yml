name: Create Release

# 仅在推送 tag 时触发（如 v1.0.0）
# exe 由本地 build.bat 构建后手动上传到 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DOTagHelper ${{ steps.version.outputs.VERSION }}
          body: |
            ## DOTagHelper ${{ steps.version.outputs.VERSION }}
            
            ### 下载说明
            下载 `DOTagHelper_${{ steps.version.outputs.VERSION }}.zip`，解压后运行 `DOTagHelper.exe` 即可。
            
            ### 环境要求
            - Windows 10/11
            - WebView2 Runtime（Windows 11 自带，Windows 10 需 [手动安装](https://developer.microsoft.com/en-us/microsoft-edge/webview2/)）
          generate_release_notes: true
          draft: true
