name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "DOTagHelper" `
            --icon "logo.ico" `
            --add-data "logo.ico;." `
            --hidden-import "clr_loader" `
            --hidden-import "pythonnet" `
            --hidden-import "webview" `
            --hidden-import "webview.platforms.edgechromium" `
            --hidden-import "webview.platforms.winforms" `
            --collect-all "webview" `
            --collect-all "clr_loader" `
            --collect-all "pythonnet" `
            DOTagHelper.py

      - name: Copy resource files to dist root
        run: |
          # 将资源文件复制到 exe 同级目录（程序的 BASE_DIR 指向 exe 所在目录）
          Copy-Item -Path "Data" -Destination "dist\DOTagHelper\Data" -Recurse -Force
          Copy-Item -Path "Docs" -Destination "dist\DOTagHelper\Docs" -Recurse -Force
          Copy-Item -Path "Workspace" -Destination "dist\DOTagHelper\Workspace" -Recurse -Force

      - name: Prepare release archive
        run: |
          $version = (Select-String -Path DOTagHelper.py -Pattern "WINDOW_TITLE\s*=\s*'DOTagHelper\s+([\d.]+)'" | ForEach-Object { $_.Matches.Groups[1].Value })
          if (-not $version) { $version = "dev" }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Compress-Archive -Path "dist\DOTagHelper\*" -DestinationPath "DOTagHelper_$version.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOTagHelper_${{ env.VERSION }}
          path: dist/DOTagHelper/

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DOTagHelper_${{ env.VERSION }}.zip
          generate_release_notes: true
